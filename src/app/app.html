<mat-toolbar class="toolbar">
  <span class="brand">TikoLiroSports</span>

  <span class="spacer"></span>

  <nav class="menu">
    <!-- Menu principal -->
    <button mat-button routerLink="/produtos">Produtos</button>
    <button mat-button [matMenuTriggerFor]="menuCadastros">Cadastros</button>
    <button mat-button [matMenuTriggerFor]="menuVendas">Vendas</button>
    <a mat-button routerLink="/relatorios" routerLinkActive="active-link">Relatórios</a>
  </nav>
</mat-toolbar>

<!-- MENU DE CADASTROS -->
<mat-menu #menuCadastros="matMenu">
  <button mat-menu-item routerLink="/categorias">Categorias</button>

  <!-- PRODUTOS com submenu -->
  <button mat-menu-item [matMenuTriggerFor]="menuProdutos">Produtos</button>

  <button mat-menu-item routerLink="/clientes">Clientes</button>
  <button mat-menu-item routerLink="/times">Times</button>
  <button mat-menu-item routerLink="/paises">Países</button>
</mat-menu>

<!-- SUBMENU DE PRODUTOS -->
<mat-menu #menuProdutos="matMenu">
  <button mat-menu-item routerLink="/produtos">Listar Produtos</button>
  <button mat-menu-item routerLink="/produtos/novo">Novo Produto</button>

  <!-- Subnível de Produtos (Adicionar Estoque) -->
  <button mat-menu-item [matMenuTriggerFor]="menuEstoque">Estoque</button>
</mat-menu>

<!-- SUBMENU DE ESTOQUE -->
<mat-menu #menuEstoque="matMenu">
  <button mat-menu-item routerLink="/estoque">Movimentar Estoque</button>
</mat-menu>

<!-- MENU DE VENDAS -->
<mat-menu #menuVendas="matMenu">
  <button mat-menu-item routerLink="/pedidos">Pedidos</button>
  <button mat-menu-item routerLink="/pagamentos">Pagamentos</button>
</mat-menu>

<router-outlet></router-outlet>
