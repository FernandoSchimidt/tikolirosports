<div class="container">

  <mat-card class="example-card" appearance="outlined">
    <mat-card-header class="card-header">
      <mat-card-title>Paises</mat-card-title>
      <div class="demo-button-container">
        <button mat-raised-button color="primary" (click)="novoPais()" class="demo-button">
          Novo Pais
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
 
        <!-- Nome Column -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let categoria">{{categoria.nome}}</td>
        </ng-container>

        <!-- sigla Column -->
        <ng-container matColumnDef="sigla">
          <th mat-header-cell *matHeaderCellDef>Sigla</th>
          <td mat-cell *matCellDef="let categoria">{{categoria.sigla}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let pais">
            <button mat-button (click)="editarPais(pais)" color="primary">Edit</button>
            <button mat-button (click)="removePais(pais)" color="warn">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
