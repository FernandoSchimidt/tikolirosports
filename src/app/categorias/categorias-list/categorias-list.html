<div class="container">

  <mat-card class="example-card" appearance="outlined">
    <mat-card-header class="card-header">
      <mat-card-title>Categorias</mat-card-title>
      <div class="demo-button-container">
        <button mat-raised-button color="primary" (click)="novaCategoria()" class="demo-button">
          Nova Categoria
        </button>
      </div>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
        <!-- Id Column -->
        <!-- <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Id</th>
          <td mat-cell *matCellDef="let categoria">{{categoria.id}}</td>
        </ng-container> -->

        <!-- Nome Column -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let categoria">{{categoria.nome}}</td>
        </ng-container>

        <!-- descricao Column -->
        <ng-container matColumnDef="descricao">
          <th mat-header-cell *matHeaderCellDef>Descrição</th>
          <td mat-cell *matCellDef="let categoria">{{categoria.descricao}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let categoria">
            <button mat-button (click)="editarCategoria(categoria)" color="primary">Edit</button>
            <button mat-button (click)="removeCategoria(categoria)" color="warn">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
