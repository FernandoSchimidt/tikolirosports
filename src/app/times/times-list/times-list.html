<div class="container">

    <mat-card class="example-card" appearance="outlined">
        <mat-card-header class="card-header">
            <mat-card-title>Times</mat-card-title>
            <div class="demo-button-container">
                <button mat-raised-button color="primary" (click)="novoTime()" class="demo-button">
                    Novo Time   
                </button>
            </div>
        </mat-card-header>
        <mat-card-content>
            <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
             
                <!-- Nome Column -->
                <ng-container matColumnDef="nome">
                    <th mat-header-cell *matHeaderCellDef>Nome</th>
                    <td mat-cell *matCellDef="let time">{{time.nome}}</td>
                </ng-container>

                <!-- Pais Column -->
                <ng-container matColumnDef="pais">
                    <th mat-header-cell *matHeaderCellDef>Pais</th>
                    <td mat-cell *matCellDef="let time">{{time.pais.nome}}</td>
                </ng-container>

                <!-- Campeonato Column -->
                <ng-container matColumnDef="campeonato">
                    <th mat-header-cell *matHeaderCellDef>Campeonato</th>
                    <td mat-cell *matCellDef="let time">{{time.campeonato}}</td>
                </ng-container>
                
                <!-- Categoria Column -->
                <ng-container matColumnDef="categoria">
                    <th mat-header-cell *matHeaderCellDef>Categoria</th>
                    <td mat-cell *matCellDef="let time">{{time.categoria.nome}}</td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef>Ações</th>
                    <td mat-cell *matCellDef="let time">
                        <button mat-button (click)="editarTime(time)" color="primary">Edit</button>
                        <button mat-button (click)="removeTime(time)" color="warn">Delete</button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
            </table>
        </mat-card-content>
    </mat-card>
</div>
