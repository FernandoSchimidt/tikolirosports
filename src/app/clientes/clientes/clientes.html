<div class="container">

  <mat-card class="example-card" appearance="outlined">
    <mat-card-header class="card-header">
      <mat-card-title>Clientes</mat-card-title>
      <div class="demo-button-container">
          <button matButton="elevated" (click)="novoCliente()" class="demo-button">
            Novo Cliente
          </button>
        </div>
    </mat-card-header>
    <mat-card-content>
      <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 demo-table">
        <!-- Id Column -->
        <!-- <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>Id</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.id}}</td>
        </ng-container> -->

        <!-- Nome Column -->
        <ng-container matColumnDef="nome">
          <th mat-header-cell *matHeaderCellDef>Nome</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.nome}}</td>
        </ng-container>

        <!-- Telefone Column -->
        <ng-container matColumnDef="telefone">
          <th mat-header-cell *matHeaderCellDef>Telefone</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.telefone}}</td>
        </ng-container>

        <!-- email Column -->
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.email}}</td>
        </ng-container>

        <!-- time Column -->
        <ng-container matColumnDef="time">
          <th mat-header-cell *matHeaderCellDef>Time Favorito</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.timeFavorito?.nome}}</td>
        </ng-container>

        <!-- Observacao Column -->
        <ng-container matColumnDef="observacao">
          <th mat-header-cell *matHeaderCellDef>Observação</th>
          <td mat-cell *matCellDef="let cliente">{{cliente.observacao}}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Ações</th>
          <td mat-cell *matCellDef="let cliente">
            <button mat-button color="primary" (click)="editarCliente(cliente)">Edit</button>
            <button mat-button  color="warn" (click)="removeCliente(cliente)">Delete</button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
      </table>
    </mat-card-content>
  </mat-card>
</div>
